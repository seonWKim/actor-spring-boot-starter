# Replaces the base application.yaml: no Kubernetes API discovery. The store comes from the
# overlay's environment (SPRING_ACTOR_CLUSTER_DISCOVERY_METHOD and the store's connection).
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-actor-config
data:
  application.yaml: |
    spring:
      application:
        name: spring-actor-app
      # The web server's drain, before the actor system shuts down: preStop 10s + 10s + shutdown 25s
      # fits the Deployment's 45s grace period. Spring Boot's default is 30s.
      lifecycle:
        timeout-per-shutdown-phase: 10s
      actor:
        name: spring-actor-system
        provider: cluster
        remote:
          hostname: ${POD_IP}
          port: 25520
          bind-hostname: 0.0.0.0
        cluster:
          join: discovery
          discovery:
            heartbeat-interval: 5s
            ttl: 30s
          downing:
            strategy: keep-majority
        shutdown:
          timeout: 25s
        # Pekko settings that have no typed spring.actor key.
        pekko:
          actor:
            allow-java-serialization: off
          cluster:
            split-brain-resolver:
              stable-after: 20s
          management:
            http:
              hostname: ${POD_IP}
              port: 7626
              bind-hostname: 0.0.0.0
              bind-port: 7626
            cluster:
              bootstrap:
                contact-point-discovery:
                  required-contact-point-nr: 2
    server:
      port: 8080
      shutdown: graceful
    management:
      # Actuator (health, metrics, info, prometheus) on its own port: the NetworkPolicy opens 8080 to
      # every client but 8081 only to the monitoring namespace (and the kubelet's probes).
      server:
        port: 8081
      endpoints:
        web:
          exposure:
            include: health,prometheus,info,metrics
      endpoint:
        health:
          probes:
            enabled: true
          group:
            readiness:
              # Ready only while this pod is an Up cluster member.
              include: readinessState,actorCluster
      health:
        actor:
          warmup:
            # /actuator/health/warmup is UP once this pod is an Up member of a cluster with at
            # least 2 Up members, and the store answers. blue-green.sh deploy waits for it.
            min-members: 2
