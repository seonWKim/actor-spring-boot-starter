# Weekly dependency updates. Gradle libraries come in three pull requests, so one bad bump doesn't block
# the rest: Pekko, Spring, and everything else (a dependency goes to the first group it matches). Every
# GitHub Action comes in one more. Pinned actions (uses: owner/repo@<sha> # vX.Y.Z) get their SHA and comment updated.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      pekko:
        patterns:
          - "org.apache.pekko*"
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      gradle:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
