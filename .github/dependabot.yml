# Weekly dependency updates. Gradle libraries come in three pull requests, so one bad bump doesn't block
# the rest: Pekko, Spring, and everything else (a dependency goes to the first group it matches). Every
# GitHub Action comes in one more. Pinned actions (uses: owner/repo@<sha> # vX.Y.Z) get their SHA and comment updated.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      pekko:
        patterns:
          - "org.apache.pekko*"
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      gradle:
        patterns:
          - "*"
    ignore:
      # springdoc 3 is built on Spring Boot 4 and stops the synchronization example from starting on
      # Boot 3.5. Remove this with the Boot 4 upgrade.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
