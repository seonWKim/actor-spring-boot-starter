{% extends "base.html" %}

{% block extrahead %}
  {% set card = config.site_url ~ "/assets/brand/social-card.png" %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ (page.title ~ ' - ' if page and page.title else '') ~ config.site_name }}">
  <meta property="og:description" content="{{ (page.meta.description if page and page.meta else None) or 'The actor model for Spring Boot, on Apache Pekko. Actors are Spring beans.' }}">
  <meta property="og:image" content="{{ card }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ card }}">
{% endblock %}
